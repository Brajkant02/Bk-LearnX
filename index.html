
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef0e7">
<title>BK LearnX | Loading</title>

<style>
:root {
  --page: #eef0e7;
  --ink: #1b2925;
  --muted: #64756d;
  --orange: #ff5b3d;
  --green: #1f4943;
  --green-soft: #dce6df;
  --line: #d4d9cf;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 38%,
      rgba(255,255,255,.78),
      transparent 48%
    ),
    var(--page);
  color: var(--ink);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}

.loading-screen {
  width: min(460px, calc(100% - 36px));
  text-align: center;
  padding: 48px 42px 40px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.78);
  box-shadow: 0 24px 70px rgba(31,73,67,.09);
  animation: appear .65s ease-out both;
}

.brand-mark {
  width: 78px;
  height: 78px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  position: relative;
  border-radius: 22px;
  color: white;
  background: var(--green);
  box-shadow: 0 12px 26px rgba(31,73,67,.18);
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: -7px;
  border: 1.5px solid rgba(31,73,67,.20);
  border-radius: 27px;
  animation: ring 2.2s ease-out infinite;
}

.brand-mark svg {
  width: 43px;
  height: 43px;
}

.brand-name {
  margin: 0;
  font-size: clamp(30px, 7vw, 36px);
  line-height: 1.1;
  letter-spacing: -1.4px;
  font-weight: 800;
}

.brand-name span {
  color: var(--orange);
}

.tagline {
  margin: 11px 0 34px;
  color: var(--muted);
  font-size: 14px;
}

.loading-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 11px;
  font-size: 12px;
  font-weight: 650;
  color: var(--muted);
}

#percentage {
  color: var(--orange);
  font-variant-numeric: tabular-nums;
}

.progress-track {
  height: 8px;
  overflow: hidden;
  border-radius: 20px;
  background: var(--green-soft);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    var(--green),
    #397267
  );
  transition: width .12s linear;
}

.loading-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 26px;
}

.loading-dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
  animation: bounce 1s ease-in-out infinite;
}

.loading-dots i:nth-child(2) {
  animation-delay: .15s;
}

.loading-dots i:nth-child(3) {
  animation-delay: .3s;
}

.footer {
  margin: 24px 0 0;
  color: #849087;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes ring {
  0% {
    transform: scale(.96);
    opacity: .8;
  }
  100% {
    transform: scale(1.2);
    opacity: 0;
  }
}

@keyframes bounce {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .5;
  }
  30% {
    transform: translateY(-5px);
    opacity: 1;
  }
}

@media (max-width: 480px) {
  .loading-screen {
    padding: 40px 25px 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="loading-screen" role="status" aria-live="polite">

  <!-- BK LearnX Logo -->
  <div class="brand-mark" aria-hidden="true">

    <svg viewBox="0 0 48 48"
         fill="none"
         xmlns="http://www.w3.org/2000/svg">

      <path d="M5.5 10.5C12.2 8.6 18.7 9.7 24 14v27c-5.3-4.3-11.8-5.4-18.5-3.5v-27Z"
            stroke="white" stroke-width="2.5"
            stroke-linejoin="round"/>

      <path d="M42.5 10.5C35.8 8.6 29.3 9.7 24 14v27c5.3-4.3 11.8-5.4 18.5-3.5v-27Z"
            stroke="white" stroke-width="2.5"
            stroke-linejoin="round"/>

      <path d="M24 14v27"
            stroke="white" stroke-width="2"/>

      <path d="M11 17.5c3.4-.5 6.4.1 9 1.6M11 23c3.4-.5 6.4.1 9 1.6M37 17.5c-3.4-.5-6.4.1-9 1.6M37 23c-3.4-.5-6.4.1-9 1.6"
            stroke="white" stroke-width="1.6"
            stroke-linecap="round"/>

      <path d="M36 5.5v7m-3.5-3.5h7"
            stroke="#ff8a70" stroke-width="2.3"
            stroke-linecap="round"/>

    </svg>
  </div>

  <!-- Brand Name -->
  <h1 class="brand-name">
    BK <span>LearnX</span>
  </h1>

  <p class="tagline">
    Your learning space is getting ready
  </p>

  <!-- Loading Status -->
  <div class="loading-info">
    <span id="statusText">
      Preparing your experience
    </span>

    <span id="percentage">0%</span>
  </div>

  <!-- Progress Bar -->
  <div class="progress-track"
       role="progressbar"
       aria-label="Loading progress"
       aria-valuemin="0"
       aria-valuemax="100"
       aria-valuenow="0"
       id="progress">

    <div class="progress-fill" id="progressFill"></div>

  </div>

  <!-- Animated Dots -->
  <div class="loading-dots">
    <i></i>
    <i></i>
    <i></i>
  </div>

  <p class="footer">
    Learn · Practice · Grow
  </p>

</main>

<script>

// Homepage URL
const HOME_PAGE = "/pages/home/index.html";

const fill = document.getElementById("progressFill");
const percentage = document.getElementById("percentage");
const statusText = document.getElementById("statusText");
const progress = document.getElementById("progress");

const messages = [
  "Preparing your experience",
  "Setting up your study space",
  "Almost ready"
];

let value = 0;

// Loading Animation
const loadingTimer = setInterval(() => {

  value = Math.min(
    value + Math.ceil((100 - value) / 10),
    100
  );

  fill.style.width = value + "%";
  percentage.textContent = value + "%";

  progress.setAttribute(
    "aria-valuenow",
    value
  );

  if (value < 40) {
    statusText.textContent = messages[0];
  }
  else if (value < 80) {
    statusText.textContent = messages[1];
  }
  else {
    statusText.textContent = messages[2];
  }

  // Redirect after loading animation
  if (value === 100) {

    clearInterval(loadingTimer);

    setTimeout(() => {
      window.location.replace(HOME_PAGE);
    }, 350);

  }

}, 75);

</script>

</body>
</html>
