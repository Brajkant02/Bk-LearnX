<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PGDCA - Sem 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icons" type="image/jpeg" href="../../../assets/images/logo.jpeg">
</head>

<body>
  <div class="app" id="app">
    <header class="header">
      <div class="hl">
        <button class="icon-btn" id="toggle" aria-label="Menu show ya hide karo" aria-expanded="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <a class="brand" href="#unit-1"><span class="logo">BK</span><span>Bk LeanX</span></a>
      </div>
      <div class="hc">
        <div class="subj">Java</div>
        <div class="meta">PGDCA · Semester 3</div>
      </div>
      <div class="hr">
        <a class="home" href="../../home/index.html"><svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" />
          </svg><span>Home</span></a>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar" aria-label="Units">
        <div class="sb-in">
          <div class="sb-top">
            <a class="brand" href="#unit-1"><span class="logo">Bk</span><span>Bk LearnX</span></a>
            <button class="icon-btn" id="close" aria-label="Menu band karo"><svg viewBox="0 0 24 24">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg></button>
          </div>
          <div class="sb-title">Units</div>
          <!-- Naya unit: ek <li> copy karo, data-src mein apni HTML file ka path likho -->
          <ul class="units" id="units">
            <li class="unit"><a class="unit-link" href="#unit-1" data-src="./units/Unit-1/index.html"><span
                  class="badge">1</span><span class="u-name">Introduction and Features</span></a><a
                class="icon-btn dl" href="./pdf/java introduction & feature hindi.pdf" download aria-label="Unit 1 download"><svg
                  viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-2" data-src="units/Unit-2/index.html"><span
                  class="badge">2</span><span class="u-name">Language Constructs</span></a><a class="icon-btn dl"
                href="./pdf/java language constructs hindi.pdf" download aria-label="Unit 2 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-3" data-src="units/Unit-3/index.html"><span
                  class="badge">3</span><span class="u-name">Classes and Objects</span></a><a class="icon-btn dl"
                href="./pdf/java class & objects hindi.pdf" download aria-label="Unit 3 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-4" data-src="units/Unit-4/index.html"><span
                  class="badge">4</span><span class="u-name">Inheritance</span></a><a class="icon-btn dl"
                href="./pdf/Java inheritance hindi.pdf" download aria-label="Unit 4 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-5" data-src="units/Unit-5/index.html"><span
                  class="badge">5</span><span class="u-name">Abstract Class and Interface</span></a><a class="icon-btn dl"
                href="./pdf/Java abstract class & interface Hindi.pdf" download aria-label="Unit 5 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-6" data-src="units/Unit-6/index.html"><span
                  class="badge">5</span><span class="u-name">Polymorphism</span></a><a class="icon-btn dl"
                href="./pdf/java polymorphism hindi.pdf" download aria-label="Unit 6 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-7" data-src="units/Unit-7/index.html"><span
                  class="badge">7</span><span class="u-name">Exception Handling</span></a><a class="icon-btn dl"
                href="./pdf/Java exception handling hindi.pdf" download aria-label="Unit 7 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
            <li class="unit"><a class="unit-link" href="#unit-8" data-src="units/Unit-8/index.html"><span
                  class="badge">8</span><span class="u-name">Multithreading</span></a><a class="icon-btn dl"
                href="./pdf/Java multithreading hindi.pdf" download aria-label="Unit 8 download"><svg viewBox="0 0 24 24">
                  <path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" />
                </svg></a></li>
          </ul>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main class="main" id="main">
        <article class="sheet" id="sheet"></article>
      </main>
    </div>
  </div>

  <script>
    var app = document.getElementById('app'), main = document.getElementById('main'), sheet = document.getElementById('sheet'),
      items = Array.prototype.slice.call(document.querySelectorAll('.unit')), tok = 0, DL = '<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>';
    function isMobile() {return window.matchMedia('(max-width:820px)').matches}
    function setDrawer(o) {app.classList.toggle('drawer-open', o); document.getElementById('toggle').setAttribute('aria-expanded', String(o))}
    function msg(cls, html) {sheet.innerHTML = '<div class="' + cls + '">' + html + '</div>'}

    async function load(n) {
      var t = ++tok, li = items[n], src = li.querySelector('.unit-link').dataset.src,
        name = li.querySelector('.u-name').textContent, pdf = li.querySelector('.dl').getAttribute('href');
      main.classList.remove('framed'); main.scrollTop = 0;
      msg('state', 'Unit is loading....');
      try {
        var r = await fetch(src); if (t !== tok) return;
        if (!r.ok) {msg('err', '<b>File not founded.</b><br>please check path : <code></code>'); sheet.querySelector('code').textContent = src; return }
        var doc = new DOMParser().parseFromString(await r.text(), 'text/html'); if (t !== tok) return;
        sheet.innerHTML = '<p class="crumb">Unit ' + (n + 1) + ' of ' + items.length + '</p><div id="content"></div>';
        var c = document.getElementById('content'); c.innerHTML = doc.body.innerHTML;
        var bar = document.createElement('div'); bar.className = 'top-row';
        bar.innerHTML = '<a class="btn" download>' + DL + '<span></span></a>';
        bar.firstChild.href = pdf; bar.querySelector('span').textContent = 'Unit ' + (n + 1) + ' download';
        var h = c.querySelector('h1'); if (h) h.after(bar); else c.prepend(bar);
        var p = document.createElement('div'); p.className = 'pager';
        p.innerHTML = (n > 0 ? '<a class="btn ghost" href="#unit-' + n + '">Back</a>' : '<span></span>') + (n < items.length - 1 ? '<a class="btn" href="#unit-' + (n + 2) + '">Next</a>' : '');
        sheet.appendChild(p);
      } catch (e) {
        /* fetch block ho (jaise file:// se kholne par) to file iframe mein dikhao */
        if (t !== tok) return;
        main.classList.add('framed'); sheet.innerHTML = '';
        var f = document.createElement('iframe'); f.className = 'frame'; f.title = name; f.src = src; sheet.appendChild(f);
      }
    }
    function route() {
      var m = /^#unit-(\d+)$/.exec(location.hash), n = m ? parseInt(m[1], 10) - 1 : 0;
      if (n < 0 || n >= items.length) n = 0;
      items.forEach(function (li, i) {
        li.classList.toggle('active', i === n);
        var a = li.querySelector('.unit-link');
        if (i === n) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      document.title = items[n].querySelector('.u-name').textContent + ' – java';
      if (isMobile()) setDrawer(false);
      load(n);
    }
    document.getElementById('toggle').onclick = function () {
      if (isMobile()) {setDrawer(!app.classList.contains('drawer-open'))}
      else {var c = app.classList.toggle('collapsed'); this.setAttribute('aria-expanded', String(!c))}
    };
    document.getElementById('close').onclick = function () {setDrawer(false)};
    document.getElementById('scrim').onclick = function () {setDrawer(false)};
    document.addEventListener('keydown', function (e) {if (e.key === 'Escape') setDrawer(false)});
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>

</html>
