    <style>
        :root {
            --bg: #eef0e7;
            --bg-dark: #14312c;
            --card: #ffffff;
            --card-border: rgba(23, 36, 31, 0.14);
            --accent: #ff5b39;
            --accent-soft: #fdeee9;
            --text: #17241f;
            --muted: #5b6b63;
            --input-bg: #ffffff;
            --button-bg: #ff5b39;
            --button-hover: #e6491f;
            --shadow: 0 20px 45px rgba(23, 36, 31, 0.08);
        }

        html[data-theme='dark'] {
            --bg: #14312c;
            --bg-dark: #0d211d;
            --card: #1c3a34;
            --card-border: rgba(255, 255, 255, 0.12);
            --accent: #ff8a68;
            --accent-soft: rgba(255, 91, 57, 0.14);
            --text: #eef0e7;
            --muted: #a9beb6;
            --input-bg: #14312c;
            --button-bg: #ff5b39;
            --button-hover: #ff8a68;
            --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: "Sora", "Inter", sans-serif;
            letter-spacing: -0.02em;
        }

        a:focus-visible, button:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .page-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 0;
            background: transparent;
            box-shadow: none;
            border-bottom: 1px solid var(--card-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-family: "Sora", sans-serif;
        }

        .brand img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 26px;
        }

        .site-nav a {
            position: relative;
            text-decoration: none;
            color: var(--muted);
            padding: 6px 2px;
            border-radius: 0;
            font-weight: 600;
            font-size: 0.92rem;
            transition: color 0.18s ease;
        }

        .site-nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.18s ease;
        }

        .site-nav a:hover {
            color: var(--text);
            background-color: transparent;
        }

        .site-nav a:hover::after {
            transform: scaleX(1);
        }

        .page-banner {
            margin-top: 32px;
            padding: 1.8rem 1.8rem;
            background: var(--bg-dark);
            color: #eef0e7;
            border-radius: 20px;
            border-bottom: 3px solid var(--accent);
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
        }

        .page-banner h1 {
            margin-top: 8px;
            font-size: clamp(1.3rem, 2.4vw, 1.8rem);
            font-weight: 700;
        }

        .main-content {
            flex: 1;
            width: 100%;
            margin: 0 auto;
            padding: 1.6rem 0;
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .toolbar-item {
            background: var(--card);
            padding: 1rem 1.1rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .toolbar-item:nth-child(2) {
            border-left-color: var(--bg-dark);
        }

        .toolbar-item label,
        .toolbar-item span {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
        }

        .toolbar-item select {
            border: 1px solid var(--card-border);
            border-radius: 9px;
            padding: 0.6rem 0.75rem;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
        }

        .toolbar-item select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .toolbar-item.highlight {
            background: var(--accent-soft);
            border-left-color: var(--accent);
        }

        .toolbar-item.highlight strong {
            font-family: "Sora", sans-serif;
            color: var(--text);
        }

        .chapter-section {
            background: var(--card);
            padding: 1.4rem;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .chapter-section h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.9rem;
        }

        .unit-card {
            display: none;
        }

        .unit-card.active {
            display: block;
        }

        .unit-card h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .site-footer {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 1rem;
            padding: 1.8rem 0 2.4rem;
            margin-top: 1.6rem;
            background: transparent;
            border-top: 1px solid var(--card-border);
        }

        .site-footer div {
            background: var(--bg-dark);
            padding: 1.1rem;
            border-radius: 14px;
            color: #eef0e7;
        }

        .site-footer h3 {
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            font-family: "Sora", sans-serif;
        }

        .site-footer a,
        .site-footer p {
            display: block;
            color: #c9d6d0;
            text-decoration: none;
            margin-bottom: 0.35rem;
            font-size: 0.88rem;
        }

        .site-footer a:hover {
            color: var(--accent);
        }

        .unit-card iframe {
            width: 100%;
            min-height: 720px;
            border: 0;
            border-radius: 12px;
            background: var(--card);
        }

        @media (max-width: 600px) {
            .page-shell {
                width: 100%;
                padding: 0 16px;
            }

                align-items: flex-start;
                gap: 0.8rem;
            }

            .toolbar,
            .site-footer {
                grid-template-columns: 1fr;
            }
        }

    <script>
        const courseConfig = {
            courseName: "P G Diploma in Computer Application(Semester-3)",

            subjects: {
                Java: {
                    name: "Object Oriented Programming Using Java",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6", "Unit-7", "Unit-8"]

                },

                IoT: {
                    name: "Internet of Things",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5"]
                },
                ECDM: {
                    name: "E-Commerce and Digital Marketing",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6", "Unit-7"]
                },

                CHM: {
                    name: "Computer Hardware & Maintenance",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6", "Unit-7", "Unit-8", "Unit-9", "Unit-10", "Unit-11", "Unit-12", "Unit-13", "Unit-14"]
                },
                SS: {
                    name: "Soft Skill",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5"]
                },
                pyq: {
                    name: "PYQ and Handwritten notes",
                    units: ["CHM", "IOT"]
                },

            }
        };

        const subjectSelect = document.getElementById("subject");
        const unitSelect = document.getElementById("unit");
        const chapterHeading = document.getElementById("chapterName");
        const currentChapter = document.getElementById("currentChapter");
        const courseTitle = document.getElementById("courseTitle");
        const unitCards = Array.from(document.querySelectorAll(".unit-card"));

        courseTitle.textContent = courseConfig.courseName;

        function loadSubjects() {
            Object.keys(courseConfig.subjects).forEach(subjectKey => {
                const option = document.createElement("option");
                option.value = subjectKey;
                option.textContent = courseConfig.subjects[subjectKey].name;
                subjectSelect.appendChild(option);
            });
        }

        function updateUnit() {
            const subject = subjectSelect.value;

            unitSelect.innerHTML = '<option value="">Select Unit</option>';
            hideAllCards();

            if (!subject) {
                chapterHeading.textContent = "Select a subject";
                currentChapter.textContent = "Select subject and unit";
                return;
            }

            courseConfig.subjects[subject].units.forEach(unit => {
                const option = document.createElement("option");
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });

            chapterHeading.textContent = courseConfig.subjects[subject].name;
            currentChapter.textContent = "Select a unit";
        }

        function getUnitKey(unitValue) {
            if (!unitValue) return "";

            const match = unitValue.toLowerCase().match(/unit-\d+/);
            return match ? match[0] : unitValue;
        }

        function hideAllCards() {
            unitCards.forEach(card => {
                card.classList.remove("active");
            });
        }

        function updateChapter() {
            const subject = subjectSelect.value;
            const unit = unitSelect.value;
            const selectedUnitKey = getUnitKey(unit);

            hideAllCards();

            if (!subject) {
                chapterHeading.textContent = "Select a subject";
                currentChapter.textContent = "Select subject and unit";
                return;
            }

            if (!unit) {
                chapterHeading.textContent = courseConfig.subjects[subject].name;
                currentChapter.textContent = "Select a unit";
                return;
            }

            let contentFound = false;

            unitCards.forEach(card => {
                const cardSubject = card.getAttribute("data-subject");
                const cardUnit = card.getAttribute("data-unit");

                if (cardSubject === subject && cardUnit === selectedUnitKey) {
                    card.classList.add("active");
                    contentFound = true;
                }
            });

            const subjectName = courseConfig.subjects[subject].name;

            chapterHeading.textContent = `${subjectName} - ${unit}`;
            currentChapter.textContent = `${subjectName} • ${unit}`;

            if (!contentFound) {
                currentChapter.textContent = "Content not added yet";
            }
        }

        subjectSelect.addEventListener("change", updateUnit);
        unitSelect.addEventListener("change", updateChapter);

        document.addEventListener("DOMContentLoaded", () => {
            loadSubjects();
        });
    </script>
