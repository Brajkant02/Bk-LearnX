    <script>
        const courseConfig = {
            courseName: "Web Designing Semester-1",

            subjects: {
                ppba: {
                    name: "Practice & Procedure of Business Account",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6"]
                },

                ppca: {
                    name: "Practice & Procedure of Company Account",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6"]
                },

                cafm: {
                    name: "Cost Accounting & Finacial Management",
                    units: ["Unit-1", "Unit-2", "Unit-3", "Unit-4", "Unit-5", "Unit-6", "Unit-7", "Unit-8"]
                },

                gst: {
                    name: "Goods & Service Tax(GST)",
                    units: ["Unit-1 : Introduction of GST", "Unit-2 : Registraction Under GST", "Unit-3 : GST With Tally ERP9", "Unit-4 : Transactions Under GST", "Unit-5 : GST Reports", "Unit-6: Tally Prime - Not Syllabus Part"]
                },
                eba: {
                    name: "Elements of Banking and Auditing",
                    units: ["Unit-1 : Banking System & Concept", "Unit-2 : Bank and Banking System", "Unit-3 : Accounts Operated by the Banker", "Unit-4 : Negotiable Instruments", "Unit-5 : Advance banking/e-banking", "Unit-6 : Auditing Concepts Engagement Documentation and need for Audit", "Unit-7 : Auditing Evidence", "Unit-8 : Audit Sampling and analytical Review Procedures", "Unit-9 : Audit of Payment and Receipt, Purchase  Sales, Assets and Liabilities", "Unit-10 : Company Audit", "Unit-11 : Audit Report & Audit of Special Company"]
                },

                
                cfa: {
                    name: "Computer Fundamental & Application",
                    units: ["Unit-1 : unit 2 included", "Unit-3 : unit 4 included", "Unit-5", "Unit-6", "Unit-7 : unit 8 included", "Unit-9", "Unit-10 : unit 11 included", "Unit-12 : unit 13 included"]
                },
                // pyq: {
                //     name: "Handwritten Notes and PYQ",
                //     units: ["bcit", "i&wt", "pyhthon", "WDT", "DBMS"]
                // },
            }
        };

        const subjectSelect = document.getElementById("subject");
        const unitSelect = document.getElementById("unit");
        const chapterHeading = document.getElementById("chapterName");
        const currentChapter = document.getElementById("currentChapter");
        const courseTitle = document.getElementById("courseTitle");
        const unitCards = Array.from(document.querySelectorAll(".unit-card"));

        courseTitle.textContent = courseConfig.courseName;

        function loadSubjects() {
            Object.keys(courseConfig.subjects).forEach(subjectKey => {
                const option = document.createElement("option");
                option.value = subjectKey;
                option.textContent = courseConfig.subjects[subjectKey].name;
                subjectSelect.appendChild(option);
            });
        }

        function updateUnit() {
            const subject = subjectSelect.value;

            unitSelect.innerHTML = '<option value="">Select Unit</option>';
            hideAllCards();

            if (!subject) {
                chapterHeading.textContent = "Select a subject";
                currentChapter.textContent = "Select subject and unit";
                return;
            }

            courseConfig.subjects[subject].units.forEach(unit => {
                const option = document.createElement("option");
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });

            chapterHeading.textContent = courseConfig.subjects[subject].name;
            currentChapter.textContent = "Select a unit";
        }

        function getUnitKey(unitValue) {
            if (!unitValue) return "";

            const match = unitValue.toLowerCase().match(/unit-\d+/);
            return match ? match[0] : "";
        }

        function hideAllCards() {
            unitCards.forEach(card => {
                card.classList.remove("active");
            });
        }

        function updateChapter() {
            const subject = subjectSelect.value;
            const unit = unitSelect.value;
            const selectedUnitKey = getUnitKey(unit);

            hideAllCards();

            if (!subject) {
                chapterHeading.textContent = "Select a subject";
                currentChapter.textContent = "Select subject and unit";
                return;
            }

            if (!unit) {
                chapterHeading.textContent = courseConfig.subjects[subject].name;
                currentChapter.textContent = "Select a unit";
                return;
            }

            let contentFound = false;

            unitCards.forEach(card => {
                const cardSubject = card.getAttribute("data-subject");
                const cardUnit = card.getAttribute("data-unit");

                if (cardSubject === subject && cardUnit === selectedUnitKey) {
                    card.classList.add("active");
                    contentFound = true;
                }
            });

            const subjectName = courseConfig.subjects[subject].name;

            chapterHeading.textContent = `${subjectName} - ${unit}`;
            currentChapter.textContent = `${subjectName} • ${unit}`;

            if (!contentFound) {
                currentChapter.textContent = "Content not added yet";
            }
        }

        subjectSelect.addEventListener("change", updateUnit);
        unitSelect.addEventListener("change", updateChapter);

        document.addEventListener("DOMContentLoaded", () => {
            loadSubjects();
        });
    </script>
