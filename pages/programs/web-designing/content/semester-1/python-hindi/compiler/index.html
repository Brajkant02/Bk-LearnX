<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Python Compiler</title>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>
    <link rel="stylesheet" href="./style.css">

<link rel="stylesheet" href="../../../../../../../assets/shared/unit-enhancements.css">
<script src="../../../../../../../assets/shared/portal.js" defer></script>
<script src="../../../../../../../assets/shared/unit-enhancements.js" defer></script>
</head>

<body>

    <div class="compiler-container">
        <h2>Python Code Compiler</h2>

        <textarea id="code-input" spellcheck="false"
            placeholder="write-your-python-code-here.">print("Hello, World!")</textarea>

        <div class="button-group">
            <button id="run-btn" onclick="runPython()">Run Output</button>
            <button id="clear-code-btn" onclick="clearCode()">Clear Code</button>
            <button id="clear-result-btn" onclick="clearResult()">Clear Result</button>
        </div>

        <div class="output-container">
            <pre id="output-area"></pre>
        </div>
        <script src="./next.js"></script>
    </div>
</body>

</html>
