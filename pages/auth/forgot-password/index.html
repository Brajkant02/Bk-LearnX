<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | BK LearnX</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/images/logo.jpeg">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link rel="stylesheet" href="../../../assets/shared/portal.css">
</head>
<body>
  <main class="portal-shell login-shell">
    <section class="portal-card login-card">
      <div class="login-illustration">🔐</div>
      <h1>Forgot Password</h1>
      <p class="muted">Registered email enter karein. Hum 6-digit verification code bhejenge.</p>

      <form id="emailForm">
        <div class="field" style="margin-top:18px">
          <label for="email">Registered Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="student@example.com">
        </div>
        <button id="sendBtn" class="portal-btn" style="width:100%;margin-top:18px">Send Verification Code</button>
      </form>

      <form id="codeForm" hidden>
        <div class="field" style="margin-top:18px">
          <label for="code">6-digit Code</label>
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" style="letter-spacing:6px;text-align:center;font-size:1.25rem">
        </div>
        <button id="verifyBtn" class="portal-btn" style="width:100%;margin-top:18px">Verify Code</button>
        <button id="resendBtn" type="button" class="portal-btn" style="width:100%;margin-top:10px;background:#64748b">Resend Code</button>
      </form>

      <p id="msg" class="muted" style="margin-top:14px;min-height:1.4em"></p>
      <p style="margin-top:18px"><a href="../login/index.html">← Back to Login</a></p>
    </section>
  </main>

  <script src="../../../assets/shared/config.js"></script>
  <script>
    const emailForm = document.getElementById('emailForm');
    const codeForm = document.getElementById('codeForm');
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const msg = document.getElementById('msg');
    const sendBtn = document.getElementById('sendBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    let verifiedEmail = '';

    async function sendCode() {
      const email = emailInput.value.trim();
      if (!email) return;
      sendBtn.disabled = true;
      resendBtn.disabled = true;
      msg.textContent = 'Code bheja ja raha hai...';
      try {
        const response = await fetch(BK_CONFIG.API_BASE_URL + '/api/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Code send nahi hua.');
        verifiedEmail = email;
        emailInput.readOnly = true;
        emailForm.querySelector('button').hidden = true;
        codeForm.hidden = false;
        codeInput.focus();
        msg.textContent = data.message;
      } catch (error) {
        msg.textContent = error.message || 'Backend server connect nahi hua.';
      } finally {
        sendBtn.disabled = false;
        resendBtn.disabled = false;
      }
    }

    emailForm.addEventListener('submit', async event => { event.preventDefault(); await sendCode(); });
    resendBtn.addEventListener('click', sendCode);

    codeForm.addEventListener('submit', async event => {
      event.preventDefault();
      const code = codeInput.value.trim();
      if (!/^\d{6}$/.test(code)) { msg.textContent = '6-digit code enter karein.'; return; }
      verifyBtn.disabled = true;
      msg.textContent = 'Code verify ho raha hai...';
      try {
        const response = await fetch(BK_CONFIG.API_BASE_URL + '/api/verify-reset-code', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: verifiedEmail, code })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Verification failed.');
        msg.textContent = data.message;
        sessionStorage.setItem('bk_password_reset_token', data.resetToken);
        setTimeout(() => location.href = '../reset-password/index.html', 500);
      } catch (error) {
        msg.textContent = error.message || 'Verification failed.';
      } finally { verifyBtn.disabled = false; }
    });
  </script>
</body>
</html>
