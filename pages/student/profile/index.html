<!doctype html>
<html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FB7SX0P0D3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-FB7SX0P0D3');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Profile | BK LearnX</title>
  <link rel="stylesheet" href="../../../assets/shared/portal.css">
  <link rel="stylesheet" href="../../../assets/shared/theme.css">
</head>

<body data-login-url="../../auth/login/index.html" style="background:var(--bk-bg)">
  <main class="portal-shell">
    <header class="portal-header">
      <div>
        <h1>Student Profile</h1>
        <p class="muted">Profile, course access aur learning progress</p>
      </div>
      <div><a class="portal-btn secondary" href="../../home/index.html">Home</a> <button class="portal-btn danger"
          data-logout>Logout</button></div>
    </header>
    <section class="portal-card profile-grid">
      <div><img id="avatar" class="avatar" src="../../../assets/images/logo.jpeg" alt="Profile"><input id="photo"
          type="file" accept="image/*" style="margin-top:12px;max-width:190px">
        <p class="muted" style="font-size:.8rem">Max recommended: 1 MB</p>
      </div>
      <form id="profileForm">
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="name" required></div>
          <div class="field"><label>Email</label><input id="email" disabled></div>
          <div class="field"><label>Branch/Course</label><select id="branch">
              <option>PGDCA</option>
              <option>DSML</option>
              <option>Cyber Security</option>
              <option>Web Designing</option>
              <option>IOT</option>
              <option>Drone Technology</option>
              <option>CHM</option>
              <option>PGDA</option>s
              <option>CHN</option>
            </select></div>
          <div class="field"><label>Semester</label><select id="semester">
              <option>1st Semester</option>
              <option>2nd Semester</option>
              <option>3rd Semester</option>
              <option>4th Semester</option>
              <option>5th Semester</option>
              <option>6th Semester</option>
            </select></div>
          <div class="field"><label>Phone</label><input id="phone" inputmode="tel"></div>
          <div class="field"><label>College</label><input id="college"></div>
        </div><button class="portal-btn" style="margin-top:16px">Save Profile</button><span id="msg"
          class="muted"></span>
      </form>
    </section>
    <section class="portal-card" style="margin-top:18px">
      <h2>Course Progress</h2>
      <div id="progress">
        <p class="empty-state">Progress loading...</p>
      </div>
    </section>
  </main>
  <script src="../../../assets/shared/config.js"></script>
  <script src="../../../assets/shared/portal.js"></script>
  <script>
    (async () => { if (!BK.getToken()) { location.href = '../../auth/login/index.html'; return } const el = id => document.getElementById(id); const semesters = { PGDCA: 4, DSML: 2, 'Cyber Security': 2, 'Web Designing': 2, IOT: 2, 'Drone Technology': 2, CHN: 2, PGDA: 2 }; let profile; try { profile = (await BK.api('/api/me')).user; localStorage.setItem('bk_user', JSON.stringify(profile)) } catch (e) { localStorage.removeItem('bk_user'); localStorage.removeItem('bk_token'); location.href = '../../auth/login/index.html'; return } const setSemesters = () => { const count = semesters[el('branch').value] || 2; el('semester').innerHTML = Array.from({ length: count }, (_, i) => `<option>${i + 1}${i === 0 ? 'st' : i === 1 ? 'nd' : i === 2 ? 'rd' : 'th'} Semester</option>`).join('') }; el('name').value = profile.name || ''; el('email').value = profile.email || ''; el('branch').value = profile.branch || 'PGDCA'; setSemesters(); el('semester').value = profile.semester || '1st Semester'; el('phone').value = profile.phone || ''; el('college').value = profile.college || ''; if (profile.photo) el('avatar').src = profile.photo; el('branch').onchange = () => { setSemesters(); el('msg').textContent = 'Semester list updated. Save profile to keep this course.' }; el('photo').onchange = () => { const f = el('photo').files[0]; if (!f) return; if (f.size > 1.5 * 1024 * 1024) { alert('Image 1.5 MB se chhoti rakhein'); return } const r = new FileReader; r.onload = () => el('avatar').src = r.result; r.readAsDataURL(f) }; el('profileForm').onsubmit = async e => { e.preventDefault(); try { const body = { name: el('name').value, branch: el('branch').value, semester: el('semester').value, phone: el('phone').value, college: el('college').value, photo: el('avatar').src }; const d = await BK.api('/api/me', { method: 'PUT', body: JSON.stringify(body) }); localStorage.setItem('bk_user', JSON.stringify(d.user)); profile = d.user; el('msg').textContent = ' Saved successfully'; } catch (x) { el('msg').textContent = ' ' + x.message } }; try { const d = await BK.api('/api/progress'); const items = d.progress || []; if (!items.length) { el('progress').innerHTML = '<p class="empty-state">Abhi koi unit complete mark nahi ki gayi.</p>' } else { const groups = {}; items.forEach(x => { const key = x.subject || 'Learning Content'; groups[key] = groups[key] || []; groups[key].push(x) }); el('progress').innerHTML = Object.entries(groups).map(([k, v]) => `<div class="progress-row"><div class="progress-meta"><strong>${k}</strong><span>${v.filter(x => x.completed).length}/${v.length} completed</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(v.filter(x => x.completed).length / v.length * 100)}%"></div></div></div>`).join('') } } catch { el('progress').innerHTML = '<p class="empty-state">Backend connect hone par progress yahan dikhegi.</p>' } })();
  </script>
  <script>
    window.addEventListener('load', async () => {
      if (!BK.getToken()) return;
      try {
        const records = (await BK.api('/api/learning/progress')).progress || [];
        const groups = records.reduce((map, record) => { const key = record.subjectId || record.subject || 'Course'; (map[key] ||= []).push(record); return map; }, {});
        const values = Object.entries(groups).map(([subject, items]) => { const percent = Math.round(items.reduce((sum, item) => sum + Number(item.maxScrollPercent || 0), 0) / items.length); const completed = items.filter(item => item.status === 'COMPLETED').length; const active = items.reduce((sum, item) => sum + Number(item.activeTimeSeconds || 0), 0); return `<article style="padding:14px 0;border-bottom:1px solid var(--bk-border)"><strong>${subject}</strong><div style="margin:8px 0;height:8px;background:#e7edf3;border-radius:5px;overflow:hidden"><span style="display:block;width:${percent}%;height:100%;background:#16803b"></span></div><span>${percent}% tracked · ${completed}/${items.length} chapters completed · ${Math.round(active / 60)} min studied</span></article>`; });
        document.getElementById('progress').innerHTML = values.length ? values.join('') : '<p class="empty-state">Learning progress will appear when you study a chapter.</p>';
      } catch { /* legacy profile remains available if tracking is unavailable */ }
    });
  </script>
</body>

</html>
