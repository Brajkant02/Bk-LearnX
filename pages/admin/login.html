<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../../assets/shared/portal.css"></head><body style="background:var(--bk-bg)"><main class="portal-shell" style="max-width:460px;padding-top:10vh"><form id="f" class="portal-card"><h1>Admin Login</h1><p class="muted">BK LearnX management panel</p><div class="field" style="margin-top:18px"><label>Email</label><input id="email" type="email" required value="admin@bklearnx.local"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required></div><button class="portal-btn" style="width:100%;margin-top:16px">Login</button><p id="msg" class="muted"></p></form></main><script>const API=(localStorage.getItem('bk_api_base')||'https://bk-learnx-api.onrender.com').replace(/\/$/,'');f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.message);localStorage.setItem('bk_admin_token',d.token);location.href='index.html'}catch(x){msg.textContent=x.message||'Login failed'}};</script></body></html>
