<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <link rel="stylesheet" href="../../assets/shared/portal.css">
</head>

<body>
  <main class="portal-shell login-shell">
    <form id="f" class="portal-card login-card">
      <div class="login-illustration">🔐</div>
      <h1>Admin Login</h1>
      <p class="muted">Secure access to the BK LearnX management panel.</p>
      <div class="field" style="margin-top:18px">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" required value="admin@bklearnx.local">
      </div>
      <div class="field" style="margin-top:12px">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="portal-btn" style="width:100%;margin-top:18px">Login</button>
      <p id="msg" class="muted" style="margin-top:12px;min-height:1.2em"></p>
    </form>
  </main>
  <script>
    const _defaultApi = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:')
      ? 'http://localhost:3000'
      : 'https://bk-learnx-api.onrender.com';
    const API = (localStorage.getItem('bk_api_base') || _defaultApi).replace(/\/$/, '');

    f.onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await fetch(API + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value, password: password.value })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.message);
        localStorage.setItem('bk_admin_token', d.token);
        location.href = 'index.html';
      } catch (x) {
        msg.textContent = x.message || 'Login failed';
      }
    };
  </script>
</body>

</html>
