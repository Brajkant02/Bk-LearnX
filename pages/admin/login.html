<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link rel="stylesheet" href="../../assets/shared/portal.css">
</head>

<body>
  <main class="portal-shell login-shell">
    <form id="f" class="portal-card login-card">
      <div class="login-illustration">🔐</div>
      <h1>Admin Login</h1>
      <p class="muted">Secure access to the BK LearnX management panel.</p>
      <div class="field" style="margin-top:18px">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" required value="admin@bklearnx.local">
      </div>
      <div class="field" style="margin-top:12px">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="portal-btn" style="width:100%;margin-top:18px">Login</button>
      <p id="msg" class="muted" style="margin-top:12px;min-height:1.2em"></p>
    </form>
  </main>
  <script src="../../assets/shared/config.js"></script>
  <script>
    const API = BK_CONFIG.API_BASE_URL;
    const form = document.getElementById('f');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('msg');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Checking...';
      try {
        const response = await fetch(API + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Login failed');
        localStorage.setItem('bk_admin_token', data.token);
        location.href = 'index.html';
      } catch (error) {
        message.textContent = error.message || 'Backend server connect nahi hua.';
      }
    });
  </script>
</body>

</html>
