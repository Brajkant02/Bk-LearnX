<!doctype html>
<html>

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FB7SX0P0D3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FB7SX0P0D3');

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Panel | BK LearnX</title>
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
    <link rel="stylesheet" href="../../assets/shared/portal.css">
</head>

<body style="background:var(--bk-bg)">
    <main class="portal-shell">
        <header class="portal-header">
            <div>
                <h1>BK LearnX Admin Panel</h1>
                <p class="muted">Students, sessions, page time aur course progress</p>
            </div><button id="logout" class="portal-btn danger">Admin Logout</button>
        </header>
        <section class="stat-grid">
            <div class="portal-card stat"><span class="muted">Registered Students</span><strong id="total">—</strong>
            </div>
            <div class="portal-card stat"><span class="muted">Currently Online</span><strong id="online">—</strong>
            </div>
            <div class="portal-card stat"><span class="muted">Logins Today</span><strong id="today">—</strong></div>
            <div class="portal-card stat"><span class="muted">Avg. Completion</span><strong id="completion">—</strong>
            </div>
        </section>
        <section class="dashboard-grid">
            <div class="portal-card">
                <div class="section-title"><h2>Students</h2><input id="studentSearch" placeholder="Search name or email" style="max-width:240px;padding:10px;border:1px solid var(--bk-border);border-radius:10px"></div>
                <div style="overflow:auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course/Sem</th>
                                <th>Status</th>
                                <th>Last activity</th>
                                <th>Progress</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students"></tbody>
                    </table>
                </div>
            </div>
            <div class="portal-card">
                <h2>Live/Page Activity</h2>
                <div id="activity" class="empty-state">Loading...</div>
            </div>
            <div class="portal-card">
                <h2>Most Visited Pages</h2>
                <div id="topPages" class="empty-state">Loading...</div>
            </div>
        </section>
    </main>
    <script src="../../assets/shared/config.js"></script>
    <script>
        const API = BK_CONFIG.API_BASE_URL;
        const token = localStorage.getItem('bk_admin_token');
        if (!token) location.href = 'login.html';

        async function load() {
            try {
                const [r, pagesResponse] = await Promise.all([
                    fetch(API + '/api/admin/dashboard', { headers: { 'x-admin-token': token } }),
                    fetch(API + '/api/admin/top-pages', { headers: { 'x-admin-token': token } })
                ]);
                if (!r.ok) throw new Error('Unauthorized');
                const d = await r.json();
                const pagesData = pagesResponse.ok ? await pagesResponse.json() : { pages: [] };
                const stats = d.stats || {};
                const studentsList = Array.isArray(d.students) ? d.students : [];
                const activityList = Array.isArray(d.recentActivity) ? d.recentActivity : [];
                total.textContent = stats.totalStudents ?? studentsList.length;
                online.textContent = stats.onlineStudents ?? 0;
                today.textContent = stats.loginsToday ?? 0;
                completion.textContent = `${stats.averageCompletion ?? 0}%`;
                renderStudents(studentsList);
                activity.innerHTML = activityList.length ? activityList.map(a => `<div style="padding:9px 0;border-bottom:1px solid #e5e7eb"><strong>${escapeHTML(a.studentName || 'Student')}</strong> — ${escapeHTML(a.action || 'activity')}<br><span class="muted">${escapeHTML(a.title || a.page || '')} · ${Number(a.durationSeconds || 0)}s</span></div>`).join('') : '<p class="empty-state">No activity yet.</p>';
                const pages = Array.isArray(pagesData.pages) ? pagesData.pages.slice(0, 20) : [];
                topPages.innerHTML = pages.length ? pages.map((page, index) => `<div style="padding:9px 0;border-bottom:1px solid #e5e7eb"><strong>${index + 1}. ${escapeHTML(page.page)}</strong><br><span class="muted">${Number(page.visits) || 0} visits</span></div>`).join('') : '<p class="empty-state">No page visits yet.</p>';
            } catch (error) {
                console.error(error);
                activity.innerHTML = '<p class="empty-state">Backend server connect nahi hua ya admin access invalid hai.</p>';
            }
        }

        function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]); }
        function renderStudents(list) { const query = (studentSearch.value || '').toLowerCase(); const filtered = list.filter(s => `${s.name || ''} ${s.email || ''} ${s.branch || ''}`.toLowerCase().includes(query)); students.innerHTML = filtered.length ? filtered.map(s => { const state = s.presence || (s.online ? 'ONLINE' : 'OFFLINE'); const label = state === 'ONLINE' ? 'Online' : state === 'AWAY' ? 'Away' : 'Offline'; const minutes = Math.floor((s.activeTimeSeconds || 0) / 60); const action = s.status === 'blocked' ? 'unblock' : 'block'; return `<tr><td><strong>${escapeHTML(s.name || 'Student')}</strong><br><span class="muted">${escapeHTML(s.email || '')}</span><br><span class="muted">${escapeHTML(s.phone || 'No phone')} · ${escapeHTML(s.college || 'No college')}</span></td><td>${escapeHTML(s.branch || '—')}<br>${escapeHTML(s.semester || '—')}<br><span class="muted">Registered: ${s.registeredAt ? escapeHTML(new Date(s.registeredAt).toLocaleDateString()) : '—'}</span></td><td><span class="badge ${state === 'ONLINE' ? 'online' : 'offline'}">${label}</span><br>${escapeHTML(s.status || 'active')}</td><td>${escapeHTML(s.currentChapter || s.currentPage || '—')}<br><span class="muted">${s.currentSection ? `Section: ${escapeHTML(s.currentSection)} · ` : ''}${Number(s.readingProgress) || 0}% · ${minutes} min active</span><br><span class="muted">Last login: ${s.lastLoginAt ? escapeHTML(new Date(s.lastLoginAt).toLocaleString()) : '—'}</span></td><td>${Number(s.completion) || 0}%</td><td><button class="portal-btn secondary" data-action="${action}" data-id="${Number(s.id)}">${action === 'block' ? 'Block' : 'Unblock'}</button> <button class="portal-btn danger" data-action="delete" data-id="${Number(s.id)}">Delete</button></td></tr>`; }).join('') : '<tr><td colspan="6" class="empty-state">No matching students.</td></tr>'; }
        studentSearch.addEventListener('input', () => load());
        students.addEventListener('click', async event => { const button = event.target.closest('button[data-action][data-id]'); if (!button) return; const action = button.dataset.action; const id = Number(button.dataset.id); if (action === 'delete' && !confirm('Delete this student and their learning data?')) return; button.disabled = true; try { const method = action === 'delete' ? 'DELETE' : 'PUT'; const path = action === 'delete' ? `/api/admin/students/${id}` : `/api/admin/students/${id}/${action}`; const response = await fetch(API + path, { method, headers: { 'x-admin-token': token } }); const result = await response.json(); if (!response.ok) throw new Error(result.message || 'Student update failed.'); await load(); } catch (error) { alert(error.message); button.disabled = false; } });
        logout.onclick = async () => { try { await fetch(API + '/api/admin/logout', { method: 'POST', headers: { 'x-admin-token': token } }); } finally { localStorage.removeItem('bk_admin_token'); location.href = 'login.html'; } };
        load();
        setInterval(load, 15000);
    </script>
  <script src="../../assets/shared/config.js"></script>
</body>

</html>
